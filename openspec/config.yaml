schema: spec-driven

context: |
  项目是听悦客户端 Ting Reader Flutter，源码位于本仓库，使用 Flutter 3.47.0 和 Dart。
  支持 Android、iOS、Windows、macOS 和 Linux；服务端是独立项目，不在客户端任务中顺带修改。
  业务代码位于 lib/，回归测试位于 test/，本地插件分支位于 third_party/。
  音频链路包含 just_audio、audio_session、本地 just_audio_background 和 audio_service；
  修改音频行为时先核对实际依赖路径、平台原生实现和媒体命令状态，避免只改未参与构建的副本。
  文档和新增代码注释使用简体中文；保留 OpenSpec 必需的英文结构标题、SHALL/MUST 关键词及标识符。
  文件末尾不添加多余空行。
  每次修改代码前先检查工作区并执行 git pull --ff-only；存在本地改动时先保护现场，禁止覆盖或丢弃。
  尽量通过现有源码、日志、测试定位问题；普通实现细节自主处理，仅在关键事实缺失时提问。
  静态检查、单元测试和云端构建不能证明真机行为；必须明确区分已验证事实、推断和待真机验证事项。
  版本和发布规则以当前 README.md、pubspec.yaml、CHANGELOG.md 及用户当次指令为准。
  安装和配置 OpenSpec 本身不触发客户端打包或发布。

rules:
  proposal:
    - 说明用户可观察的问题、预期行为和受影响平台，以代码或日志支持原因判断。
    - 需求变更保持聚焦，明确涉及的能力和影响范围。
  specs:
    - 按平台描述可观察行为和验收场景，覆盖适用的播放、切章、暂停、后台及恢复边界。
    - 不把未经验证的根因或实现细节写成已成立的产品要求。
  design:
    - 核对实际参与构建的依赖和原生代码，优先沿用现有架构并给出最小必要改动。
    - 对跨平台差异、状态同步和验证限制给出具体说明。
  tasks:
    - 使用可勾选任务，包含实现、与改动相关的验证及适用的真机验收项。
    - 缺少真机条件时保留待验收状态，不将模拟测试通过等同于用户问题已解决。

operations:
  apply:
    guidance:
      - 修改代码前检查工作区并执行 git pull --ff-only，保护已有本地改动。
      - 先运行相关测试；提交或发布前按 scripts/check.sh 和质量工作流完成适用检查。
      - 汇报具体改动、验证结果和仍需真机确认的事项，避免重复询问用户已说明的信息。
  archive:
    guidance:
      - 归档前核对任务和验收证据，保留真实的验证限制。
